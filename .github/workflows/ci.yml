name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Emulator tests
        run: npm run test:emu
        env:
          # Points the Admin SDK at the emulator — no real credentials needed
          FIRESTORE_EMULATOR_HOST: "localhost:8080"

      - name: Build
        run: npm run build
        env:
          # Stub env vars so the build doesn't fail on missing secrets
          NEXTAUTH_SECRET: "ci-dummy-secret-do-not-use"
          NEXTAUTH_URL: "http://localhost:3000"
          FIREBASE_ADMIN_PROJECT_ID: "demo-test-project"
          FIREBASE_ADMIN_CLIENT_EMAIL: "ci@demo-test-project.iam.gserviceaccount.com"
          FIREBASE_ADMIN_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIIEvAIBADANBgkqhkiG9w0BAQEFAASCBKYwggSiAgEAAoIBAQC7\n-----END PRIVATE KEY-----\n"
          NEXT_PUBLIC_FIREBASE_API_KEY: "ci-dummy"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "demo-test-project.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "demo-test-project"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "demo-test-project.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "ci-dummy"
          CLOUDINARY_API_KEY: "000000000000000"
          CLOUDINARY_API_SECRET: "ci-dummy-cloudinary-secret"
          FIRESTORE_EMULATOR_HOST: "localhost:8080"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
